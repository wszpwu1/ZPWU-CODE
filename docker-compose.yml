version: '3.9'

services:
  zpwu:
    build: .
    # 若使用发布镜像，注释掉 build 改用 image：
    # image: ghcr.io/wszpwu1/zpwu-code:latest
    container_name: zpwu
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ADDR=:8080
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # 可选：设置后前端需填写此令牌才能访问 API
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN:-}
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
