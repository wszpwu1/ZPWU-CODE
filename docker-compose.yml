version: '3.9'

services:
  zpwu:
    build: .
    # 若使用发布镜像，注释掉 build 改用 image：
    # image: ghcr.io/wszpwu1/zpwu-code:latest
    container_name: zpwu
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ADDR=:8080
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # 可选：设置后前端需填写此令牌才能访问 API
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN:-}
      # 可选但推荐（反向代理/公网部署）：固定 OAuth redirect_uri 基址，防止 Host 头攻击
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      # 可选：设为 1 时对 LLM base_url 走严格 SSRF 策略（禁用回环+私网）
      - SSRF_STRICT=${SSRF_STRICT:-}
      # 可选：让草稿箱落盘持久化（需挂载数据卷，见下方 volumes）
      - DRAFTS_FILE=${DRAFTS_FILE:-}
    # 使用 DRAFTS_FILE 时启用数据卷（示例：DRAFTS_FILE=/data/drafts.json）
    volumes:
      - zpwu-data:/data
    # 健康检查
    healthcheck:
      # 镜像基于 scratch，容器内没有 shell/wget，只能由二进制自检。
      test: ["CMD", "/zpwu", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  zpwu-data:
